<div class="fps-jt">
	<div class="fps-jt-head">
		<span class="fps-jt-title">Job Tracker</span>
		<span class="fps-jt-help">open jobs by customer &mdash; what FPS is doing, on what consignment, and where it has reached</span>
		<span class="fps-jt-meta" data-fps="meta"></span>
	</div>
	<div class="fps-jt-legend" data-fps="legend"></div>
	<div class="fps-jt-scroll">
		<table class="fps-jt-table">
			<thead>
				<tr>
					<th class="fps-jt-cust">Customer</th>
					<th>FPS JO</th>
					<th>Customer ref</th>
					<th>Scope of work</th>
					<th>Consignment</th>
					<th>Route</th>
					<th>ETA</th>
					<th>Status</th>
				</tr>
			</thead>
			<tbody data-fps="rows">
				<tr><td colspan="8" class="fps-jt-msg">Loading&hellip;</td></tr>
			</tbody>
		</table>
	</div>
</div>

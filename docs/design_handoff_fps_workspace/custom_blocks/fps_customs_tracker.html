<div class="fps-ct">
	<div class="fps-ct-head">
		<span class="fps-ct-title">Customs Tracker</span>
		<span class="fps-ct-help">every declaration &mdash; narrow any column, click a row to open it</span>
		<input class="fps-ct-search" data-fps="search" type="search"
		       placeholder="Search all columns" aria-label="Search all columns" />
		<button type="button" class="fps-ct-clear" data-fps="clear">Clear filters</button>
		<span class="fps-ct-meta" data-fps="meta"></span>
	</div>
	<div class="fps-ct-scroll">
		<table class="fps-ct-table">
			<!-- Header, filter row and body are all built from the column list the
			     server returns, so adding a column is a one-line change in
			     pipeline.py rather than an edit in three files. -->
			<thead>
				<tr data-fps="labels"></tr>
				<tr class="fps-ct-filterrow" data-fps="filters"></tr>
			</thead>
			<tbody data-fps="rows">
				<tr><td class="fps-ct-msg">Loading&hellip;</td></tr>
			</tbody>
		</table>
	</div>
</div>
